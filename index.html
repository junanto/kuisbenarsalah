<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kuis Interaktif Gestur Tangan</title>

  <!-- Pustaka MediaPipe Lengkap -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    * { box-sizing: border-box; font-family: sans-serif; }
    body { margin: 0; background: #f0f2f5; display: flex; flex-direction: column; align-items: center; }
    header { background: #1e293b; color: white; width: 100%; text-align: center; padding: 10px; }
    .container { display: flex; gap: 20px; max-width: 900px; width: 90%; margin-top: 20px; flex-wrap: wrap; }
    .card { background: white; border-radius: 12px; padding: 20px; flex: 1; min-width: 300px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    .video-wrapper { position: relative; width: 100%; aspect-ratio: 4/3; background: #000; border-radius: 8px; overflow: hidden; }
    video, canvas { position: absolute; width: 100%; height: 100%; transform: scaleX(-1); }
    .gesture-badge { font-size: 1.2rem; font-weight: bold; padding: 10px; text-align: center; border-radius: 8px; margin-top: 10px; background: #e2e8f0; }
    .progress-container { width: 100%; background: #e2e8f0; height: 10px; border-radius: 5px; margin-top: 8px; overflow: hidden; }
    .progress-bar { width: 0%; height: 100%; background: #2563eb; transition: width 0.1s linear; }
    .question { font-size: 1.2rem; font-weight: bold; margin: 15px 0; }
    .feedback { font-size: 1.1rem; font-weight: bold; margin-top: 10px; }
    button { background: #2563eb; color: white; border: none; padding: 8px 16px; border-radius: 6px; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>

  <header>
    <h2>Kuis Gestur Tangan (Benar / Salah)</h2>
    <small>👍 Jempol Atas = BENAR | 👎 Jempol Bawah = SALAH</small>
  </header>

  <div class="container">
    <div class="card">
      <div class="video-wrapper">
        <video id="webcam" autoplay playsinline></video>
        <canvas id="output_canvas"></canvas>
      </div>
      <div id="gesture-detected" class="gesture-badge">Menyiapkan Deteksi...</div>
      <div class="progress-container">
        <div id="hold-progress" class="progress-bar"></div>
      </div>
    </div>

    <div class="card">
      <div>Skor: <span id="score">0</span></div>
      <div id="question" class="question">Memuat Soal...</div>
      <div id="feedback" class="feedback"></div>
      <button id="next-btn" onclick="nextQuestion()" style="display:none;">Soal Berikutnya</button>
    </div>
  </div>

  <script>
    const quizData = [
      { q: "Matahari terbit dari sebelah Timur.", answer: "BENAR" },
      { q: "Monumen Nasional (Monas) terletak di Bandung.", answer: "SALAH" },
      { q: "Hasil dari 15 + 25 adalah 40.", answer: "BENAR" }
    ];

    let currentIdx = 0, score = 0, isLocked = false;
    let detectedAnswer = null, holdStartTime = null;
    const HOLD_DURATION = 1500;

    const videoElement = document.getElementById('webcam');
    const canvasElement = document.getElementById('output_canvas');
    const canvasCtx = canvasElement.getContext('2d');
    const gestureBadge = document.getElementById('gesture-detected');
    const progressBar = document.getElementById('hold-progress');

    function loadQuestion() {
      if (currentIdx >= quizData.length) {
        document.getElementById('question').innerText = `Kuis Selesai! Skor: ${score}`;
        document.getElementById('next-btn').style.display = 'none';
        isLocked = true;
        return;
      }
      isLocked = false;
      detectedAnswer = null;
      holdStartTime = null;
      progressBar.style.width = '0%';
      gestureBadge.innerText = 'Tunjukkan Gestur';
      document.getElementById('feedback').innerText = '';
      document.getElementById('next-btn').style.display = 'none';
      document.getElementById('question').innerText = quizData[currentIdx].q;
    }

    function checkAnswer(userAnswer) {
      isLocked = true;
      const correct = quizData[currentIdx].answer;
      if (userAnswer === correct) {
        score += 20;
        document.getElementById('score').innerText = score;
        document.getElementById('feedback').innerText = "Jawaban Tepat! 🎉";
      } else {
        document.getElementById('feedback').innerText = `Kurang Tepat! Jawaban: ${correct}`;
      }
      document.getElementById('next-btn').style.display = 'inline-block';
    }

    function nextQuestion() {
      currentIdx++;
      loadQuestion();
    }

    function analyzeHand(landmarks) {
      if (isLocked) return;

      const thumbTip = landmarks[4];
      const thumbIP = landmarks[3];
      const thumbMCP = landmarks[2];

      const otherFingersFolded = 
        landmarks[8].y > landmarks[5].y &&
        landmarks[12].y > landmarks[9].y &&
        landmarks[16].y > landmarks[13].y &&
        landmarks[20].y > landmarks[17].y;

      let currentGesture = null;
      if (otherFingersFolded) {
        if (thumbTip.y < thumbIP.y && thumbIP.y < thumbMCP.y) currentGesture = "BENAR";
        else if (thumbTip.y > thumbIP.y && thumbIP.y > thumbMCP.y) currentGesture = "SALAH";
      }

      if (currentGesture) {
        if (detectedAnswer === currentGesture) {
          const elapsed = Date.now() - holdStartTime;
          progressBar.style.width = `${Math.min((elapsed / HOLD_DURATION) * 100, 100)}%`;
          if (elapsed >= HOLD_DURATION) checkAnswer(currentGesture);
        } else {
          detectedAnswer = currentGesture;
          holdStartTime = Date.now();
        }
        gestureBadge.innerText = currentGesture === "BENAR" ? "👍 BENAR" : "👎 SALAH";
      } else {
        detectedAnswer = null;
        holdStartTime = null;
        progressBar.style.width = '0%';
        gestureBadge.innerText = "Tunjukkan Gestur (👍 / 👎)";
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });

    hands.setOptions({
      maxNumHands: 1,
      modelComplexity: 1,
      minDetectionConfidence: 0.6,
      minTrackingConfidence: 0.6
    });

    hands.onResults((results) => {
      if (videoElement.videoWidth > 0 && videoElement.videoHeight > 0) {
        canvasElement.width = videoElement.videoWidth;
        canvasElement.height = videoElement.videoHeight;
      }
      
      canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const landmarks = results.multiHandLandmarks[0];
        if (window.drawConnectors && window.HAND_CONNECTIONS) {
          drawConnectors(canvasCtx, landmarks, HAND_CONNECTIONS, {color: '#00FF00', lineWidth: 2});
          drawLandmarks(canvasCtx, landmarks, {color: '#FF0000', radius: 3});
        }
        analyzeHand(landmarks);
      } else {
        if (!isLocked) {
          detectedAnswer = null;
          holdStartTime = null;
          progressBar.style.width = '0%';
          gestureBadge.innerText = "Tangan Tidak Terdeteksi";
        }
      }
    });

    const camera = new Camera(videoElement, {
      onFrame: async () => {
        await hands.send({ image: videoElement });
      },
      width: 640,
      height: 480
    });

    camera.start();
    loadQuestion();
  </script>
</body>
</html>
